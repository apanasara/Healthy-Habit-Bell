<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Bell • TV Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #060709;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 60px;
            overflow: hidden;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: rgba(229, 169, 60, 0.15);
            color: #E5A93C;
            border: 1px solid rgba(229, 169, 60, 0.3);
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .title {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #E0E0E0;
        }
        .tv-status {
            font-size: 1.1rem;
            color: #8892B0;
        }
        .center-stage {
            position: relative;
            width: 480px;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .progress-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .progress-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 10;
        }
        .progress-bar {
            fill: none;
            stroke: #E5A93C;
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 1382;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }
        .clock-container {
            text-align: center;
            z-index: 10;
        }
        .clock-time {
            font-size: 7.5rem;
            font-weight: 200;
            letter-spacing: -2px;
            color: #FFFFFF;
            line-height: 1;
        }
        .next-bell {
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #E5A93C;
            letter-spacing: 1.5px;
        }
        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }
        .btn {
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px 32px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .btn:hover, .btn:focus {
            background: rgba(229, 169, 60, 0.25);
            border-color: #E5A93C;
            transform: scale(1.05);
        }
        .btn-primary {
            background: #E5A93C;
            color: #060709;
            font-weight: 600;
            border-color: #E5A93C;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: #f3b64c;
            color: #060709;
        }
        .btn-active {
            background: rgba(229, 169, 60, 0.3);
            border-color: #E5A93C;
            color: #E5A93C;
        }
        .hint {
            color: #6C7A9C;
            font-size: 1rem;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 10px;
        }
        #ytFrame {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge">Living Room TV Dashboard</div>
        <div class="title" id="sessionTitle">🍽 Mindful Eating</div>
        <div class="tv-status" id="bgStatus">Background: ॐ Aum Drone</div>
    </div>

    <div class="center-stage">
        <svg class="progress-svg" viewBox="0 0 480 480">
            <circle class="progress-bg" cx="240" cy="240" r="220" />
            <circle class="progress-bar" id="progressBar" cx="240" cy="240" r="220" />
        </svg>
        <div class="clock-container">
            <div class="clock-time" id="clockText">20:00</div>
            <div class="next-bell" id="bellText">Next Bell in 00:30</div>
        </div>
    </div>

    <div>
        <div class="controls">
            <button class="btn" id="btnReset" onclick="resetTimer()">Reset (R)</button>
            <button class="btn btn-primary" id="btnPlayPause" onclick="togglePlayPause()">Pause (Space)</button>
            <button class="btn btn-active" id="btnBgMusic" onclick="toggleBgSound()">ॐ Music: ON (M)</button>
            <button class="btn" onclick="adjustTime(-5)">-5 Min</button>
            <button class="btn" onclick="adjustTime(5)">+5 Min</button>
        </div>
        <div class="hint">Use TV Remote [OK / Enter] to Play/Pause • Mobile phone can now be locked or turned off</div>
    </div>

    <iframe id="ytFrame" allow="autoplay; encrypted-media"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ytParam = urlParams.get('yt');
        const bgParam = urlParams.get('bg') || (ytParam ? 'yt' : 'aum');

        let totalSeconds = 1200;
        let remainingSeconds = 1200;
        let intervalSeconds = 30;
        let nextBell = 30;
        let isRunning = true;
        let timer = null;

        let isBgSoundEnabled = (bgParam !== 'none');
        let bgSoundSource = ytParam ? 'yt' : 'aum';

        const CIRCUMFERENCE = 2 * Math.PI * 220; // ~1382.3

        let audioCtx = null;
        let aumSource = null;
        let aumGain = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playHarmonicChime(freq, volume, duration) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);

                // Soft felt mallet attack envelope (50ms rise)
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(volume, now + 0.050);
                gain.gain.exponentialRampToValueAtTime(volume * 0.15, now + duration - 2.0);
                // Asymptotic smooth cosine fadeout to zero boundary
                gain.gain.linearRampToValueAtTime(0.00001, now + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + duration + 0.05);
            } catch (e) {
                console.error(e);
            }
        }

        function playCountdownStrike(secondsRemaining) {
            if (secondsRemaining === 3) {
                playHarmonicChime(2048, 0.45, 4.0);
            } else if (secondsRemaining === 2) {
                playHarmonicChime(1536, 0.70, 4.5);
            } else if (secondsRemaining === 1) {
                playHarmonicChime(1024, 1.00, 7.5);
            }
        }

        function play321SoothingSequence() {
            playHarmonicChime(2048, 0.45, 4.0);
            setTimeout(() => playHarmonicChime(1536, 0.70, 4.5), 1000);
            setTimeout(() => playHarmonicChime(1024, 1.00, 7.5), 2000);
        }

        function playIntervalChime() {
            playHarmonicChime(432, 0.85, 8.0);
        }

        function startAumDrone() {
            if (!isBgSoundEnabled || bgSoundSource !== 'aum') return;
            try {
                const ctx = getAudioContext();
                if (aumSource) return;

                const sampleRate = ctx.sampleRate;
                const duration = 16.0;
                const buffer = ctx.createBuffer(1, sampleRate * duration, sampleRate);
                const data = buffer.getChannelData(0);
                const f_om = 136.1;

                for (let i = 0; i < data.length; i++) {
                    const t = i / sampleRate;
                    const om_fund = Math.sin(2.0 * Math.PI * f_om * t);
                    const om_sub = 0.35 * Math.sin(2.0 * Math.PI * (f_om * 0.5) * t);
                    const fifth = 0.22 * Math.sin(2.0 * Math.PI * (f_om * 1.5) * t);
                    const octave = 0.18 * Math.sin(2.0 * Math.PI * (f_om * 2.0) * t);
                    const breath = 0.70 + 0.30 * Math.sin(2.0 * Math.PI * 0.125 * t);
                    const beating = 1.0 + 0.05 * Math.sin(2.0 * Math.PI * 4.5 * t);
                    data[i] = Math.tanh((om_fund + om_sub + fifth + octave) * breath * beating * 0.6) * 0.35;
                }

                aumSource = ctx.createBufferSource();
                aumSource.buffer = buffer;
                aumSource.loop = true;

                aumGain = ctx.createGain();
                aumGain.gain.setValueAtTime(0.001, ctx.currentTime);
                aumGain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 2.0);

                aumSource.connect(aumGain);
                aumGain.connect(ctx.destination);
                aumSource.start();
            } catch (e) {
                console.error("Aum Drone error:", e);
            }
        }

        function stopAumDrone() {
            if (aumSource) {
                try {
                    aumSource.stop();
                    aumSource.disconnect();
                } catch (e) {}
                aumSource = null;
            }
        }

        function startYouTubeAudio() {
            if (!isBgSoundEnabled || bgSoundSource !== 'yt') return;
            const ytId = ytParam || 'x6UITRjhijI';
            const frame = document.getElementById('ytFrame');
            frame.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&enablejsapi=1&controls=0&loop=1&playlist=${ytId}&modestbranding=1`;
        }

        function stopYouTubeAudio() {
            const frame = document.getElementById('ytFrame');
            frame.src = '';
        }

        function toggleBgSound() {
            getAudioContext();
            isBgSoundEnabled = !isBgSoundEnabled;
            const btn = document.getElementById('btnBgMusic');
            const status = document.getElementById('bgStatus');

            if (isBgSoundEnabled) {
                btn.className = "btn btn-active";
                btn.innerText = "ॐ Music: ON (M)";
                status.innerText = bgSoundSource === 'yt' ? "Background: YouTube Stream" : "Background: ॐ Aum Drone";
                if (isRunning) {
                    if (bgSoundSource === 'yt') startYouTubeAudio(); else startAumDrone();
                }
            } else {
                btn.className = "btn";
                btn.innerText = "Music: OFF (M)";
                status.innerText = "Background: Muted";
                stopAumDrone();
                stopYouTubeAudio();
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateUI() {
            document.getElementById('clockText').innerText = formatTime(remainingSeconds);
            document.getElementById('bellText').innerText = `Next Bell in ${formatTime(nextBell)}`;

            const progress = (totalSeconds - remainingSeconds) / totalSeconds;
            const offset = CIRCUMFERENCE * progress;
            document.getElementById('progressBar').style.strokeDashoffset = offset;

            document.getElementById('btnPlayPause').innerText = isRunning ? "Pause (Space)" : "Start (Space)";
        }

        function tick() {
            if (!isRunning) return;
            if (remainingSeconds === 3) {
                playCountdownStrike(3);
                document.getElementById('bellText').innerText = "🔔 3s Remaining...";
            } else if (remainingSeconds === 2) {
                playCountdownStrike(2);
                document.getElementById('bellText').innerText = "🔔 2s Remaining...";
            }

            if (remainingSeconds <= 1) {
                remainingSeconds = 0;
                isRunning = false;
                clearInterval(timer);
                stopAumDrone();
                stopYouTubeAudio();
                playCountdownStrike(1);
                document.getElementById('bellText').innerText = "Session Completed 🙏";
                updateUI();
                return;
            }

            remainingSeconds--;
            nextBell--;

            if (nextBell <= 0) {
                playIntervalChime();
                nextBell = intervalSeconds;
            }

            updateUI();
        }

        function togglePlayPause() {
            getAudioContext();
            isRunning = !isRunning;
            document.getElementById('btnPlayPause').innerText = isRunning ? "Pause (Space)" : "Start (Space)";

            if (isRunning) {
                if (bgSoundSource === 'yt') startYouTubeAudio(); else startAumDrone();
            } else {
                stopAumDrone();
                stopYouTubeAudio();
            }
        }

        function resetTimer() {
            remainingSeconds = totalSeconds;
            nextBell = intervalSeconds;
            updateUI();
        }

        function adjustTime(minutes) {
            totalSeconds = Math.max(60, totalSeconds + minutes * 60);
            remainingSeconds = Math.min(totalSeconds, remainingSeconds + minutes * 60);
            updateUI();
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.code === 'KeyR') {
                resetTimer();
            } else if (e.code === 'KeyM') {
                toggleBgSound();
            }
        });

        // Autostart on first user click or remote press
        window.addEventListener('click', () => {
            getAudioContext();
            if (isRunning && isBgSoundEnabled && !aumSource) {
                if (bgSoundSource === 'yt') startYouTubeAudio(); else startAumDrone();
            }
        }, { once: true });

        timer = setInterval(tick, 1000);
        updateUI();
    </script>
</body>
</html>
