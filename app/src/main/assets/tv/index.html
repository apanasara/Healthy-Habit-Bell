<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Bell • TV Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #060709;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 60px;
            overflow: hidden;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: rgba(229, 169, 60, 0.15);
            color: #E5A93C;
            border: 1px solid rgba(229, 169, 60, 0.3);
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .title {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #E0E0E0;
        }
        .tv-status {
            font-size: 1.1rem;
            color: #8892B0;
        }
        .center-stage {
            position: relative;
            width: 480px;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .progress-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .progress-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 10;
        }
        .progress-bar {
            fill: none;
            stroke: #E5A93C;
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 1382;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }
        .clock-container {
            text-align: center;
            z-index: 10;
        }
        .clock-time {
            font-size: 7.5rem;
            font-weight: 200;
            letter-spacing: -2px;
            color: #FFFFFF;
            line-height: 1;
        }
        .next-bell {
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: 500;
            color: #E5A93C;
            letter-spacing: 1.5px;
        }
        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }
        .btn {
            background: rgba(255, 255, 255, 0.08);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px 32px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }
        .btn:hover, .btn:focus {
            background: rgba(229, 169, 60, 0.25);
            border-color: #E5A93C;
            transform: scale(1.05);
        }
        .btn-primary {
            background: #E5A93C;
            color: #060709;
            font-weight: 600;
            border-color: #E5A93C;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: #f3b64c;
            color: #060709;
        }
        .btn-active {
            background: rgba(229, 169, 60, 0.3);
            border-color: #E5A93C;
            color: #E5A93C;
        }
        .hint {
            color: #6C7A9C;
            font-size: 1rem;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 10px;
        }
        .breath-ring {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            pointer-events: none;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            z-index: 2;
        }
        .breath-ring.inhale {
            transform: scale(1.22);
            background: radial-gradient(circle, rgba(229,169,60,0.35) 0%, rgba(229,169,60,0.06) 70%, transparent 100%);
            border: 2px solid #E5A93C;
            opacity: 0.85;
        }
        .breath-ring.hold-in {
            transform: scale(1.22);
            background: radial-gradient(circle, rgba(245,158,11,0.45) 0%, rgba(245,158,11,0.1) 70%, transparent 100%);
            border: 2px dashed #F59E0B;
            opacity: 0.95;
        }
        .breath-ring.exhale {
            transform: scale(0.72);
            background: radial-gradient(circle, rgba(56,189,248,0.3) 0%, rgba(56,189,248,0.05) 70%, transparent 100%);
            border: 2px solid #38BDF8;
            opacity: 0.75;
        }
        .breath-ring.hold-out {
            transform: scale(0.65);
            background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 70%);
            border: 1px dotted #818CF8;
            opacity: 0.5;
        }
        #ytFrame {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge">Living Room TV Dashboard</div>
        <div class="title" id="sessionTitle">🍽 Mindful Eating</div>
        <div class="tv-status" id="bgStatus">Background: ॐ Aum Drone</div>
    </div>

    <div class="center-stage">
        <div class="breath-ring" id="breathRing"></div>
        <svg class="progress-svg" viewBox="0 0 480 480">
            <circle class="progress-bg" cx="240" cy="240" r="220" />
            <circle class="progress-bar" id="progressBar" cx="240" cy="240" r="220" />
        </svg>
        <div class="clock-container">
            <div class="clock-time" id="clockText">20:00</div>
            <div class="next-bell" id="bellText">Next Bell in 00:30</div>
        </div>
    </div>

    <div>
        <div class="controls">
            <button class="btn" id="btnReset" onclick="resetTimer()">Reset (R)</button>
            <button class="btn btn-primary" id="btnPlayPause" onclick="togglePlayPause()">Pause (Space)</button>
            <button class="btn btn-active" id="btnBgMusic" onclick="toggleBgSound()">ॐ Music: ON (M)</button>
            <button class="btn" onclick="adjustTime(-5)">-5 Min</button>
            <button class="btn" onclick="adjustTime(5)">+5 Min</button>
        </div>
        <div class="hint">Use TV Remote [OK / Enter] to Play/Pause • Mobile phone can now be locked or turned off</div>
    </div>

    <iframe id="ytFrame" allow="autoplay; encrypted-media"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ytParam = urlParams.get('yt');
        const bgParam = urlParams.get('bg') || (ytParam ? 'yt' : 'aum');

        const totalParam = parseInt(urlParams.get('total')) || 2700;
        const intervalParam = parseInt(urlParams.get('interval')) || 60;

        let totalSeconds = totalParam;
        let remainingSeconds = totalParam;
        let intervalSeconds = intervalParam;
        let nextBell = intervalParam;
        let isRunning = true;
        let timer = null;

        let isBgSoundEnabled = (bgParam !== 'none');
        let bgSoundSource = ytParam ? 'yt' : 'aum';

        const CIRCUMFERENCE = 2 * Math.PI * 220; // ~1382.3

        let audioCtx = null;
        let aumSource = null;
        let aumGain = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }
// Helper to get current bell volume from UI slider (0.0–1.0)
function getBellVolume() {
    const slider = document.getElementById('bellVolume');
    if (slider) {
        const val = parseFloat(slider.value);
        return isNaN(val) ? 0.45 : val; // fallback to default
    }
    return 0.45;
}

// Helper to get current background music volume from UI slider (0.0–1.0)
function getBgVolume() {
    const slider = document.getElementById('bgVolume');
    if (slider) {
        const val = parseFloat(slider.value);
        return isNaN(val) ? 0.35 : val; // fallback to default
    }
    return 0.35;
}

// Update AUM drone gain and YouTube volume when background volume slider changes
document.getElementById('bgVolume').addEventListener('input', () => {
    const vol = getBgVolume();
    if (aumGain) {
        aumGain.gain.setValueAtTime(vol, getAudioContext().currentTime);
    }
    const frame = document.getElementById('ytFrame');
    if (frame && frame.contentWindow) {
        // YouTube iframe API: setVolume expects 0-100
        frame.contentWindow.postMessage(JSON.stringify({event:"command",func:"setVolume",args:[vol * 100]}), '*');
    }
});

        function playHarmonicChime(freq, volume, duration) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);

                // Soft felt mallet attack envelope (50ms rise)
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(volume, now + 0.050);
                gain.gain.exponentialRampToValueAtTime(volume * 0.15, now + duration - 2.0);
                // Asymptotic smooth cosine fadeout to zero boundary
                gain.gain.linearRampToValueAtTime(0.00001, now + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + duration + 0.05);
            } catch (e) {
                console.error(e);
            }
        }

        function playCountdownStrike(secondsRemaining) {
            if (secondsRemaining === 3) {
                playHarmonicChime(2048, getBellVolume(), 4.0);
            } else if (secondsRemaining === 2) {
                playHarmonicChime(1536, getBellVolume(), 4.5);
            } else if (secondsRemaining === 1) {
                playHarmonicChime(1024, getBellVolume(), 7.5);
            }
        }

        function play321SoothingSequence() {
            playHarmonicChime(2048, 0.45, 4.0);
            setTimeout(() => playHarmonicChime(1536, 0.70, 4.5), 1000);
            setTimeout(() => playHarmonicChime(1024, 1.00, 7.5), 2000);
        }

        function playGongChime() {
            playHarmonicChime(324, 0.95, 8.5);
        }

        function playIntervalChime() {
            play321SoothingSequence();
        }

        function startAumDrone() {
            if (!isBgSoundEnabled || bgSoundSource !== 'aum') return;
            try {
                const ctx = getAudioContext();
                if (aumSource) return;

                const sampleRate = ctx.sampleRate;
                const duration = 16.0;
                const buffer = ctx.createBuffer(1, sampleRate * duration, sampleRate);
                const data = buffer.getChannelData(0);
                const f_om = 136.1;

                for (let i = 0; i < data.length; i++) {
                    const t = i / sampleRate;
                    const om_fund = Math.sin(2.0 * Math.PI * f_om * t);
                    const om_sub = 0.35 * Math.sin(2.0 * Math.PI * (f_om * 0.5) * t);
                    const fifth = 0.22 * Math.sin(2.0 * Math.PI * (f_om * 1.5) * t);
                    const octave = 0.18 * Math.sin(2.0 * Math.PI * (f_om * 2.0) * t);
                    const breath = 0.70 + 0.30 * Math.sin(2.0 * Math.PI * 0.125 * t);
                    const beating = 1.0 + 0.05 * Math.sin(2.0 * Math.PI * 4.5 * t);
                    data[i] = Math.tanh((om_fund + om_sub + fifth + octave) * breath * beating * 0.6) * 0.35;
                }

                aumSource = ctx.createBufferSource();
                aumSource.buffer = buffer;
                aumSource.loop = true;

                aumGain = ctx.createGain();
                aumGain.gain.setValueAtTime(0.001, ctx.currentTime);
                aumGain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 2.0);

                aumSource.connect(aumGain);
                aumGain.connect(ctx.destination);
                aumSource.start();
            } catch (e) {
                console.error("Aum Drone error:", e);
            }
        }

        function stopAumDrone() {
            if (aumSource) {
                try {
                    aumSource.stop();
                    aumSource.disconnect();
                } catch (e) {}
                aumSource = null;
            }
        }

        function startYouTubeAudio() {
            if (!isBgSoundEnabled || bgSoundSource !== 'yt') return;
            const ytId = ytParam || 'x6UITRjhijI';
            const frame = document.getElementById('ytFrame');
            frame.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&enablejsapi=1&controls=0&loop=1&playlist=${ytId}&modestbranding=1`;
        }

        function stopYouTubeAudio() {
            const frame = document.getElementById('ytFrame');
            frame.src = '';
        }

        function toggleBgSound() {
            getAudioContext();
            isBgSoundEnabled = !isBgSoundEnabled;
            const btn = document.getElementById('btnBgMusic');
            const status = document.getElementById('bgStatus');

            if (isBgSoundEnabled) {
                btn.className = "btn btn-active";
                btn.innerText = "ॐ Music: ON (M)";
                status.innerText = bgSoundSource === 'yt' ? "Background: YouTube Stream" : "Background: ॐ Aum Drone";
                if (isRunning) {
                    if (bgSoundSource === 'yt') startYouTubeAudio(); else startAumDrone();
                }
            } else {
                btn.className = "btn";
                btn.innerText = "Music: OFF (M)";
                status.innerText = "Background: Muted";
                stopAumDrone();
                stopYouTubeAudio();
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        let customSubText = null;

        function updateUI() {
            document.getElementById('clockText').innerText = formatTime(remainingSeconds);
            document.getElementById('bellText').innerText = customSubText || `Next Bell in ${formatTime(nextBell)}`;

            const progress = (totalSeconds - remainingSeconds) / totalSeconds;
            const offset = CIRCUMFERENCE * progress;
            document.getElementById('progressBar').style.strokeDashoffset = offset;

            document.getElementById('btnPlayPause').innerText = isRunning ? "Pause (Space)" : "Start (Space)";
        }

        function tick() {
            if (!isRunning) return;
            if (remainingSeconds === 3) {
                playCountdownStrike(3);
                document.getElementById('bellText').innerText = "🔔 3s Remaining...";
            } else if (remainingSeconds === 2) {
                playCountdownStrike(2);
                document.getElementById('bellText').innerText = "🔔 2s Remaining...";
            }

            if (remainingSeconds <= 1) {
                remainingSeconds = 0;
                isRunning = false;
                clearInterval(timer);
                stopAumDrone();
                stopYouTubeAudio();
                playGongChime();
                customSubText = "Session Completed 🙏";
                document.getElementById('bellText').innerText = customSubText;
                updateUI();
                return;
            }

            remainingSeconds--;
            nextBell--;

            if (nextBell <= 0) {
                playIntervalChime();
                nextBell = intervalSeconds;
            }

            updateUI();
        }

        function syncWithServer() {
            fetch('/api/state')
                .then(res => res.json())
                .then(data => {
                    if (data && data.status) {
                        const serverRunning = (data.status === 'RUNNING');
                        if (isRunning !== serverRunning) {
                            isRunning = serverRunning;
                            document.getElementById('btnPlayPause').innerText = isRunning ? "Pause (Space)" : "Start (Space)";
                            if (isRunning) {
                                if (isBgSoundEnabled) {
                                    if (bgSoundSource === 'yt') startYouTubeAudio(); else startAumDrone();
                                }
                            } else {
                                stopAumDrone();
                                stopYouTubeAudio();
                            }
                        }
                        if (data.remainingSeconds !== undefined) {
                            remainingSeconds = data.remainingSeconds;
                            totalSeconds = data.totalSeconds || totalSeconds;
                            nextBell = data.nextBellSeconds || nextBell;
                        }
                        if (data.profileName) {
                            document.getElementById('sessionTitle').innerText = data.profileName;
                        }

                        // Synchronize Pranayama or Surya Namaskar posture visual details
                        const ring = document.getElementById('breathRing');
                        if (data.pranayamaPhase && data.pranayamaPhase.length > 0) {
                            const phaseDisp = data.pranayamaDisplay || data.pranayamaPhase;
                            const sanskrit = data.pranayamaSanskrit ? ` (${data.pranayamaSanskrit})` : '';
                            const roundText = `Round ${data.currentRound} / ${data.totalRounds}`;
                            customSubText = `${phaseDisp}${sanskrit} • ${roundText}`;

                            if (ring) {
                                if (data.pranayamaPhase.indexOf('INHALE') !== -1) {
                                    ring.className = 'breath-ring inhale';
                                } else if (data.pranayamaPhase.indexOf('HOLD_IN') !== -1) {
                                    ring.className = 'breath-ring hold-in';
                                } else if (data.pranayamaPhase.indexOf('EXHALE') !== -1) {
                                    ring.className = 'breath-ring exhale';
                                } else {
                                    ring.className = 'breath-ring hold-out';
                                }
                            }
                        } else if (data.poseName && data.poseName.length > 0) {
                            if (ring) ring.className = 'breath-ring';
                            const poseTitle = data.poseSanskrit ? `${data.poseName} (${data.poseSanskrit})` : data.poseName;
                            const breathCue = data.poseBreath ? ` • ${data.poseBreath}` : '';
                            const roundText = `Round ${data.currentRound} / ${data.totalRounds}`;
                            customSubText = `${poseTitle}${breathCue} • ${roundText}`;
                        } else {
                            if (ring) ring.className = 'breath-ring';
                            customSubText = null;
                        }

                        updateUI();
                    }
                })
                .catch(() => {});
        }

        function togglePlayPause() {
            getAudioContext();
            fetch('/api/action/toggle')
                .then(res => res.json())
                .then(() => syncWithServer())
                .catch(() => {});

            isRunning = !isRunning;
            document.getElementById('btnPlayPause').innerText = isRunning ? "Pause (Space)" : "Start (Space)";

            if (isRunning) {
                if (bgSoundSource === 'yt') startYouTubeAudio(); else startAumDrone();
            } else {
                stopAumDrone();
                stopYouTubeAudio();
            }
        }

        function resetTimer() {
            fetch('/api/action/stop').catch(() => {});
            remainingSeconds = totalSeconds;
            nextBell = intervalSeconds;
            updateUI();
        }

        function adjustTime(minutes) {
            totalSeconds = Math.max(60, totalSeconds + minutes * 60);
            remainingSeconds = Math.min(totalSeconds, remainingSeconds + minutes * 60);
            updateUI();
        }

        // --- Universal Smart TV Remote Control Support (Samsung Tizen & LG webOS) ---
        if (window.tizen && window.tizen.tvinputdevice) {
            try {
                const tizenKeys = [
                    'MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop',
                    'MediaFastForward', 'MediaRewind',
                    'ColorF0Red', 'ColorF1Green', 'ColorF2Yellow', 'ColorF3Blue'
                ];
                tizenKeys.forEach(key => {
                    try { window.tizen.tvinputdevice.registerKey(key); } catch (_) {}
                });
            } catch (err) {
                console.warn("Tizen key registration notice:", err);
            }
        }

        window.addEventListener('keydown', (e) => {
            const keyCode = e.keyCode || e.which;

            // 415: MediaPlay, 19: MediaPause, 10252: MediaPlayPause, 32: Space
            if (keyCode === 415) {
                e.preventDefault();
                if (!isRunning) togglePlayPause();
            } else if (keyCode === 19) {
                e.preventDefault();
                if (isRunning) togglePlayPause();
            } else if (keyCode === 10252 || keyCode === 32 || (e.code === 'Space' && e.target.tagName !== 'BUTTON')) {
                e.preventDefault();
                togglePlayPause();
            } else if (keyCode === 413 || keyCode === 82 || e.code === 'KeyR') {
                // 413: MediaStop, 82: 'R'
                e.preventDefault();
                resetTimer();
            } else if (keyCode === 77 || e.code === 'KeyM' || keyCode === 403) {
                // 77: 'M', 403: Red Color Key
                e.preventDefault();
                toggleBgSound();
            } else if (keyCode === 404) {
                // 404: Green Color Key (-5 Min)
                e.preventDefault();
                adjustTime(-5);
            } else if (keyCode === 405) {
                // 405: Yellow Color Key (+5 Min)
                e.preventDefault();
                adjustTime(5);
            } else if (keyCode === 10009 || keyCode === 461) {
                // 10009: Samsung Tizen Return, 461: LG webOS Back
                if (isRunning) {
                    e.preventDefault();
                    togglePlayPause();
                }
            }
        });

        // Autostart on first user click or remote press
        window.addEventListener('click', () => {
            getAudioContext();
            if (isRunning && isBgSoundEnabled && !aumSource) {
                if (bgSoundSource === 'yt') startYouTubeAudio(); else startAumDrone();
            }
        }, { once: true });

        timer = setInterval(tick, 1000);
        setInterval(syncWithServer, 2000);
        updateUI();
    </script>
</body>
</html>
